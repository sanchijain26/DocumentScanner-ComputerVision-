<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .usecase { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
    .label { font-size:14px; fill:#111827; font-weight:600; }
    .title { font-size:20px; font-weight:bold; fill:#111827; }
    .actorlabel { font-size:14px; fill:#111827; font-weight:600; text-anchor:middle; }
    .line { stroke:#374151; stroke-width:1.5; }
    .boundary { fill:none; stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:4,3; }
  </style>

  <text x="20" y="30" class="title">Use Case Diagram</text>

  <!-- Actor: User -->
  <g transform="translate(60,180)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="12" x2="0" y2="55" class="line"/>
    <line x1="-25" y1="30" x2="25" y2="30" class="line"/>
    <line x1="0" y1="55" x2="-20" y2="90" class="line"/>
    <line x1="0" y1="55" x2="20" y2="90" class="line"/>
    <text x="0" y="115" class="actorlabel">User</text>
  </g>

  <!-- System boundary -->
  <rect x="180" y="40" width="540" height="380" class="boundary" rx="10"/>
  <text x="450" y="60" text-anchor="middle" class="label">Document Scanner &amp; OCR System</text>

  <!-- Use cases -->
  <ellipse cx="340" cy="110" rx="120" ry="30" class="usecase"/>
  <text x="340" y="115" text-anchor="middle" class="label">Scan Single Image</text>

  <ellipse cx="580" cy="110" rx="120" ry="30" class="usecase"/>
  <text x="580" y="115" text-anchor="middle" class="label">Batch Scan Folder</text>

  <ellipse cx="340" cy="200" rx="130" ry="30" class="usecase"/>
  <text x="340" y="205" text-anchor="middle" class="label">Detect &amp; Flatten Document</text>

  <ellipse cx="580" cy="200" rx="120" ry="30" class="usecase"/>
  <text x="580" y="205" text-anchor="middle" class="label">Extract Text (OCR)</text>

  <ellipse cx="340" cy="290" rx="120" ry="30" class="usecase"/>
  <text x="340" y="295" text-anchor="middle" class="label">Export Results</text>

  <ellipse cx="580" cy="290" rx="120" ry="30" class="usecase"/>
  <text x="580" y="295" text-anchor="middle" class="label">View Run Log</text>

  <ellipse cx="450" cy="375" rx="140" ry="30" class="usecase"/>
  <text x="450" y="380" text-anchor="middle" class="label">Configure Confidence / Language</text>

  <!-- Associations -->
  <line x1="72" y1="180" x2="220" y2="110" class="line"/>
  <line x1="72" y1="185" x2="220" y2="290" class="line"/>
  <line x1="72" y1="180" x2="220" y2="375" class="line"/>

  <!-- includes -->
  <line x1="340" y1="140" x2="340" y2="170" class="line" stroke-dasharray="4,3"/>
  <text x="350" y="158" font-size="10" fill="#374151">«include»</text>
  <line x1="580" y1="140" x2="580" y2="170" class="line" stroke-dasharray="4,3"/>
  <text x="590" y="158" font-size="10" fill="#374151">«include»</text>
  <line x1="360" y1="225" x2="480" y2="200" class="line" stroke-dasharray="4,3"/>
  <line x1="360" y1="315" x2="450" y2="200" class="line" stroke-dasharray="4,3"/>
</svg>
