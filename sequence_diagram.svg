<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f7fbff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">Sequence Diagram — Document Scanning Pipeline</text>
<g font-family="Arial" font-size="17" fill="#17324d" stroke="#4d89bd" stroke-width="2">
<rect x="70" y="90" width="170" height="55" rx="14" fill="#e8f4ff"/><text x="155" y="125" text-anchor="middle">User / CLI</text>
<rect x="320" y="90" width="190" height="55" rx="14" fill="#e8f4ff"/><text x="415" y="125" text-anchor="middle">Preprocessing</text>
<rect x="600" y="90" width="180" height="55" rx="14" fill="#e8f4ff"/><text x="690" y="125" text-anchor="middle">OCREngine</text>
<rect x="870" y="90" width="180" height="55" rx="14" fill="#e8f4ff"/><text x="960" y="125" text-anchor="middle">Exporter</text>
</g>
<g stroke="#6b89a3" stroke-width="2" stroke-dasharray="7 7"><line x1="155" y1="145" x2="155" y2="700"/><line x1="415" y1="145" x2="415" y2="700"/><line x1="690" y1="145" x2="690" y2="700"/><line x1="960" y1="145" x2="960" y2="700"/></g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#365d7a"/></marker></defs>
<g font-family="Arial" font-size="15" fill="#17324d" stroke="#365d7a" stroke-width="2" marker-end="url(#arrow)">
<line x1="155" y1="190" x2="415" y2="190"/><line x1="415" y1="245" x2="155" y2="245"/>
<line x1="155" y1="300" x2="415" y2="300"/><line x1="415" y1="355" x2="155" y2="355"/>
<line x1="155" y1="410" x2="690" y2="410"/><line x1="690" y1="465" x2="155" y2="465"/>
<line x1="155" y1="520" x2="960" y2="520"/><line x1="960" y1="575" x2="155" y2="575"/>
</g>
<g font-family="Arial" font-size="16" fill="#17324d">
<text x="285" y="181" text-anchor="middle">Input image + options</text><text x="285" y="236" text-anchor="middle">Validated input</text>
<text x="285" y="291" text-anchor="middle">Detect &amp; transform document</text><text x="285" y="346" text-anchor="middle">Corrected / enhanced scan</text>
