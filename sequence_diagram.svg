<text x="555" y="511" text-anchor="middle">Export scan, TXT, JSON, PDF</text><text x="555" y="566" text-anchor="middle">Output paths / status</text>
</g>
<rect x="450" y="625" width="300" height="55" rx="14" fill="#fff4d6" stroke="#d9a62e" stroke-width="2"/><text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="17" fill="#17324d">Pipeline complete</text>
</svg>
